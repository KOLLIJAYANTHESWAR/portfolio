<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="robots" content="index, follow" />

    <!-- SEO Meta -->
    <title>Kolli Jayanth Eswar | Spring Boot Developer & Cloud Engineer</title>
    <meta
      name="description"
      content="Portfolio of Kolli Jayanth Eswar — MERN Stack Developer and Cloud & DevOps Enthusiast. Explore my projects, skills, certifications, and engineering journey."
    />
    <meta
      name="keywords"
      content="Kolli Jayanth Eswar, MERN Stack Developer, React, Node.js, AWS, DevOps, Portfolio, Full Stack Developer"
    />
    <meta name="author" content="Kolli Jayanth Eswar" />

    <!-- 🔥 FIXED DOMAIN -->
    <link rel="canonical" href="https://kollijayantheswar.in" />

    <!-- Open Graph / LinkedIn -->
    <meta property="og:title" content="Kolli Jayanth Eswar | Developer Portfolio" />
    <meta
      property="og:description"
      content="Clean, modern portfolio showcasing MERN stack projects, cloud-native systems, DevOps workflows, and real-world engineering experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kollijayantheswar.in" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kolli Jayanth Eswar | Developer Portfolio" />
    <meta
      name="twitter:description"
      content="MERN Stack Developer | Cloud & DevOps Enthusiast | Engineering clean, scalable systems."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- 🔥 FAVICON (UPDATED) -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />

  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this application.
    </noscript>
    <div id="root"></div>
  </body>
</html>
